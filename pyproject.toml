[project]
name = "rater-audit"
version = "0.1.0"
description = "Audit expert-rating quality: accuracy beyond agreement, rater screens, batch acceptance, LLM-written ratings"
authors = [
    { name = "Vahit FERYAD", email = "vahit.feryat@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
]
